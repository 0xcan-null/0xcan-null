name: Update Threat Intel in README

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # İstediğin zaman manuel de çalıştırabilirsin

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyaya yazma izni

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install requests

      - name: Scripti Çalıştır
        run: |
          python update_cve.py

      - name: Değişiklikleri Commit ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🛡️ Auto-update Cyber Threat Intel" && git push)
          
